spring.application.name=Le-Soko
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/LeSoko-Realm
server.port=8082
# =============================================================================
# 1. BASE DE DONNÉES (PostgreSQL & Flyway)
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/leSokoDB
spring.datasource.username=LeSoko_user
spring.datasource.password=LeS@k@_P@ssw@rd
spring.datasource.driver-class-name=org.postgresql.Driver

# Integration Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================================================
# 2. CACHE & SESSIONS (Redis)
# =============================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# =============================================================================
# 3. SÉCURITÉ OAUTH2 / KEYCLOAK (simba_realm)
# =============================================================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/LeSoko-Realm/protocol/openid-connect/certs

# =============================================================================
# 4. STOCKAGE D'OBJETS (MinIO - Propriétés Personnalisées)
# =============================================================================
minio.url=http://localhost:9000
minio.access-key=minio_admin
minio.secret-key=mini@_p@ssw@rd
minio.bucket-name=lesoko-documents

